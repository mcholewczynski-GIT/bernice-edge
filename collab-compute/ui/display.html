<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bernice Edge Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090c;
    --grid: rgba(45, 212, 191, 0.06);
    --ink: #e7ecef;
    --muted: #7d8a93;
    --teal: #2dd4bf;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--ink);
    font-family: "DM Sans", system-ui, sans-serif;
    overflow: hidden;
    cursor: none;
  }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }

  /* Idle */
  .idle { text-align: center; transition: opacity .6s ease; }
  .wordmark { font-family: "Bebas Neue", "DM Sans", sans-serif; font-size: 9vw; letter-spacing: .06em; line-height: .9; }
  .wordmark span { color: var(--teal); }
  .sub { font-family: "DM Mono", monospace; font-size: 1.1vw; letter-spacing: .3em; color: var(--muted); margin-top: 1.6vw; text-transform: uppercase; }
  .pulse { display: inline-block; width: .7vw; height: .7vw; border-radius: 50%; background: var(--teal); margin-right: .8vw; vertical-align: middle; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }

  /* Result */
  .result { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto; opacity: 0; transition: opacity .8s ease; }
  .result.show { opacity: 1; }
  .frame { display: flex; align-items: center; justify-content: center; padding: 3vh 3vw 0; min-height: 0; overflow: hidden; }
  .frame img { max-width: 100%; max-height: 78vh; object-fit: contain; border: 1px solid rgba(45,212,191,.25); box-shadow: 0 0 80px rgba(45,212,191,.08); }
  .caption { display: flex; justify-content: space-between; align-items: baseline; gap: 2vw; padding: 2vh 3vw 3vh; }
  .prompt { font-size: 1.6vw; line-height: 1.3; max-width: 70vw; }
  .meta { font-family: "DM Mono", monospace; font-size: .9vw; color: var(--muted); white-space: nowrap; text-align: right; }
  .meta b { color: var(--teal); font-weight: 500; }
  .tag { font-family: "DM Mono", monospace; font-size: .8vw; letter-spacing: .2em; color: var(--amber); text-transform: uppercase; display: block; margin-bottom: .5vw; }

  /* Working banner */
  .working { position: fixed; left: 3vw; right: 3vw; top: 3vh; padding: 1.4vw 1.8vw; background: rgba(7,9,12,.88); border: 1px solid rgba(245,158,11,.4); border-left: .35vw solid var(--amber); transform: translateY(-160%); transition: transform .5s ease; }
  .working.show { transform: translateY(0); }
  .working .row { display: flex; justify-content: space-between; align-items: baseline; gap: 2vw; }
  .working .what { font-size: 1.4vw; }
  .working .pct { font-family: "DM Mono", monospace; font-size: 1.2vw; color: var(--amber); }
  .bar { height: .3vw; background: rgba(255,255,255,.08); margin-top: 1vw; }
  .bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .4s linear; }

  .offline { position: fixed; top: 2vh; right: 2vw; font-family: "DM Mono", monospace; font-size: .8vw; color: var(--red); letter-spacing: .15em; display: none; }
  .offline.show { display: block; }
</style>
</head>
<body>
  <div class="stage"><div class="idle" id="idle">
    <div class="wordmark">BERNICE <span>EDGE</span></div>
    <div class="sub"><span class="pulse"></span>Ready · say “Hey Bernice, make me an image of…”</div>
  </div></div>

  <div class="result" id="result">
    <div class="frame"><img id="img" alt=""></div>
    <div class="caption">
      <div><span class="tag">Generated on this room’s Collab Compute</span><div class="prompt" id="prompt"></div></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <div class="working" id="working">
    <div class="row"><div class="what" id="what">Generating…</div><div class="pct" id="pct">0%</div></div>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <div class="offline" id="offline">DISPLAY SERVICE UNREACHABLE</div>

<script>
  const $ = (id) => document.getElementById(id);
  let shown = null;

  function showResult(latest) {
    if (!latest || latest.artifact_id === shown) return;
    const img = new Image();
    img.onload = () => {
      $("result").classList.remove("show");
      setTimeout(() => {
        $("img").src = img.src;
        $("prompt").textContent = latest.prompt;
        $("meta").innerHTML = `<b>${latest.model}</b> · ${latest.device}<br>${latest.seconds}s · ${latest.width}×${latest.height}`;
        $("idle").style.opacity = 0;
        $("result").classList.add("show");
        shown = latest.artifact_id;
      }, shown ? 400 : 0);
    };
    img.src = `/display/artifacts/${encodeURIComponent(latest.artifact_id)}.png`;
  }

  function showActive(active) {
    const w = $("working");
    if (!active) { w.classList.remove("show"); return; }
    const pct = Math.round((active.progress || 0) * 100);
    $("what").textContent = (active.status === "queued" ? "Queued: " : "Generating: ") + active.prompt;
    $("pct").textContent = active.status === "queued" ? "waiting" : pct + "%";
    $("fill").style.width = pct + "%";
    w.classList.add("show");
  }

  async function tick() {
    try {
      const r = await fetch("/display/state", { cache: "no-store" });
      const s = await r.json();
      $("offline").classList.remove("show");
      showActive(s.active);
      showResult(s.latest);
    } catch (e) {
      $("offline").classList.add("show");
    }
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
